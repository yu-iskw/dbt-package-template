name: Integration tests
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integration-tests.yml
      - dev/test_all.sh
      - macros/**/*
      - integration_tests/**/*
      - dbt_project.yml
      - Makefile
  pull_request:
    paths:
      - .github/workflows/integration-tests.yml
      - dev/test_all.sh
      - macros/**/*
      - integration_tests/**/*
      - dbt_project.yml
      - Makefile
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dbt_package_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbt_package_template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: postgres
      DBT_POSTGRES_PASSWORD: postgres
      DBT_POSTGRES_DATABASE: dbt_package_template
      DBT_POSTGRES_SCHEMA: dbt_package_template
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "integration_tests/uv.lock"
      - name: Run complete compatibility suite
        run: make test-all
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          retention-days: 3
          path: |
            integration_tests/logs
            integration_tests/target
