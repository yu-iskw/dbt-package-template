name: Integration tests
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integration-tests.yml
      - macros/**/*
      - integration_tests/**/*
      - dbt_project.yml
  pull_request:
    paths:
      - .github/workflows/integration-tests.yml
      - macros/**/*
      - integration_tests/**/*
      - dbt_project.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt-group: ["dbt-core-1-10", "dbt-core-1-11"]
        adapter: ["postgres", "duckdb"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dbt_package_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbt_package_template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: integration_tests
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "integration_tests/pyproject.toml"
      - name: Install supported Python versions
        run: uv python install 3.10 3.11 3.12
      - name: Run integration tests across Python versions in parallel
        env:
          DBT_POSTGRES_HOST: localhost
          DBT_POSTGRES_PORT: "5432"
          DBT_POSTGRES_USER: postgres
          DBT_POSTGRES_PASSWORD: postgres
          DBT_POSTGRES_DATABASE: dbt_package_template
          DBT_POSTGRES_SCHEMA: dbt_package_template
          DBT_GROUP: ${{ matrix.dbt-group }}
          ADAPTER: ${{ matrix.adapter }}
          NOX_SPEC: nox[uv]==2026.7.11
        run: |
          set -euo pipefail
          mkdir -p target
          uvx --from "${NOX_SPEC}" nox --list >/dev/null

          run_version() {
            local version="$1"
            export DBT_DUCKDB_PATH="${GITHUB_WORKSPACE}/integration_tests/target/ci_${GITHUB_RUN_ID}_${version}_${DBT_GROUP}_${ADAPTER}.duckdb"
            rm -f "${DBT_DUCKDB_PATH}"
            uvx --from "${NOX_SPEC}" nox -s \
              "unit_tests-${version}(adapter='${ADAPTER}', uv_group='${DBT_GROUP}')" \
              "integration_tests-${version}(adapter='${ADAPTER}', uv_group='${DBT_GROUP}')"
          }
          export -f run_version
          export GITHUB_WORKSPACE GITHUB_RUN_ID DBT_GROUP ADAPTER NOX_SPEC

          printf '%s\0' 3.10 3.11 3.12 \
            | xargs -0 -P "$(nproc)" -I{} bash -c 'run_version "$1"' _ {}
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ matrix.dbt-group }}-${{ matrix.adapter }}
          retention-days: 3
          path: |
            integration_tests/logs
            integration_tests/target

  fusion:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dbt_package_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbt_package_template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: integration_tests
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "integration_tests/pyproject.toml"
      - name: Install supported Python versions
        run: uv python install 3.10 3.11 3.12
      - name: Run Fusion tests across Python versions in parallel
        env:
          DBT_POSTGRES_HOST: localhost
          DBT_POSTGRES_PORT: "5432"
          DBT_POSTGRES_USER: postgres
          DBT_POSTGRES_PASSWORD: postgres
          DBT_POSTGRES_DATABASE: dbt_package_template
          DBT_POSTGRES_SCHEMA: dbt_package_template
          NOX_SPEC: nox[uv]==2026.7.11
        run: |
          set -euo pipefail
          mkdir -p target
          uvx --from "${NOX_SPEC}" nox -f noxfile_fusion.py --list >/dev/null

          run_version() {
            local version="$1"
            export DBT_DUCKDB_PATH="${GITHUB_WORKSPACE}/integration_tests/target/fusion_${GITHUB_RUN_ID}_${version}.duckdb"
            rm -f "${DBT_DUCKDB_PATH}"
            uvx --from "${NOX_SPEC}" nox -f noxfile_fusion.py -s \
              "fusion_unit_tests-${version}" \
              "fusion_integration_tests-${version}"
          }
          export -f run_version
          export GITHUB_WORKSPACE GITHUB_RUN_ID NOX_SPEC

          printf '%s\0' 3.10 3.11 3.12 \
            | xargs -0 -P "$(nproc)" -I{} bash -c 'run_version "$1"' _ {}
